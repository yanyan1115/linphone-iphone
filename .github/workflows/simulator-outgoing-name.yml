name: simulator-outgoing-name
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project LinphoneApp.xcodeproj -scheme Linphone \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | grep -E 'error:|BUILD (SUCCEEDED|FAILED)|Resolved source packages' || true
          test -d build/Build/Products/Debug-iphonesimulator/*.app
      - name: Run probe
        run: |
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/*.app | head -1)
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          GROUP=$(/usr/libexec/PlistBuddy -c 'Print APP_GROUP_NAME' "$APP/Info.plist")
          /usr/libexec/PlistBuddy -c 'Add :com.apple.security.application-groups array' -c "Add :com.apple.security.application-groups:0 string $GROUP" ent.plist
          codesign --force --sign - --timestamp=none --entitlements ent.plist "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | tail -5
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl spawn "$UDID" log stream --level debug --predicate 'eventMessage CONTAINS "CI_PROBE"' > probe.log 2>&1 &
          sleep 5
          SIMCTL_CHILD_CI_PROBE=1 xcrun simctl launch --terminate-running-process --stdout="$PWD/app.log" --stderr="$PWD/app.log" "$UDID" "$BID" > launch.log 2>&1
          echo "launch exit $?" >> launch.log
          cat launch.log
          for t in 15 30 45 60 75 90; do sleep 15; xcrun simctl io "$UDID" screenshot "shot-$t.png" || true; xcrun simctl spawn "$UDID" launchctl list | grep -i linphone | head -3 || true; done
          mkdir -p crashes; cp ~/Library/Logs/DiagnosticReports/*inphone* crashes/ 2>/dev/null || true
          ls -la crashes
          grep -a 'CI_PROBE' probe.log app.log || echo 'no CI_PROBE lines'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            xcodebuild.log
            app.log
            probe.log
            launch.log
            crashes/
            shot-*.png
